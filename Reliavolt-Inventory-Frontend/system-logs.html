<!DOCTYPE html>
<html lang="en">
<head>
    <script>try{if(localStorage.getItem('rv_theme')=== 'dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs — Reliavolt Supply</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="dashboard.html" class="logo">
                <img src="images/logo.svg" class="logo-img" alt="Reliavolt Supply">
                <div class="logo-text">
                    <span class="logo-title">Reliavolt</span>
                    <span class="logo-sub">Supply</span>
                </div>
            </a>
            <button class="sidebar-close" id="sidebarClose">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="inventory.html" class="nav-item">
                <span class="nav-icon">📦</span>
                <span class="nav-label">Inventory</span>
            </a>
            <a href="sales.html" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Sales</span>
            </a>
            <a href="delivery.html" class="nav-item">
                <span class="nav-icon">🚚</span>
                <span class="nav-label">Delivery</span>
            </a>
            <a href="users.html" class="nav-item nav-admin">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Users</span>
            </a>
            <a href="shops.html" class="nav-item nav-admin">
                <span class="nav-icon">🏪</span>
                <span class="nav-label">Shops</span>
            </a>
            <a href="system-logs.html" class="nav-item active nav-admin">
                <span class="nav-icon">🗂️</span>
                <span class="nav-label">System Logs</span>
            </a>
            <a href="reports.html" class="nav-item">
                <span class="nav-icon">📈</span>
                <span class="nav-label">Reports</span>
            </a>
            <a href="settings.html" class="nav-item">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="hamburger" id="hamburger" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
                <h1 class="page-title">System Logs</h1>
            </div>
            <div class="header-right">
                <span class="header-date" id="currentDate"></span>
                <div class="user-badge">
                    <div class="user-avatar" id="userAvatar">AD</div>
                    <div>
                        <div id="currentUser">Admin</div>
                        <div class="user-role-text" id="userRole">Admin</div>
                    </div>
                </div>
                <button class="btn-logout-header" id="logoutBtn" title="Logout">⏻ Logout</button>
            </div>
        </header>

        <main class="page-content">

            <!-- Admin Banner -->
            <div class="admin-banner">
                <span class="admin-banner-icon">🗂️</span>
                <div>
                    <div class="admin-banner-title">Admin Only — System Activity Log</div>
                    <div class="admin-banner-sub">Every create, update and delete across the system, most recent first</div>
                </div>
            </div>

            <!-- Toolbar -->
            <div class="page-toolbar">
                <div class="toolbar-group">
                    <div class="search-bar search-wide">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchLog" placeholder="Search by description or user...">
                    </div>
                    <select class="filter-select" id="actionFilter">
                        <option value="">All Actions</option>
                        <option value="create">Created</option>
                        <option value="update">Updated</option>
                        <option value="delete">Deleted</option>
                    </select>
                    <select class="filter-select" id="entityFilter">
                        <option value="">All Types</option>
                        <option value="product">Products</option>
                        <option value="sale">Sales</option>
                        <option value="customer">Customers</option>
                        <option value="user">Users</option>
                        <option value="shop">Shops</option>
                        <option value="delivery">Deliveries</option>
                        <option value="settings">Settings</option>
                    </select>
                </div>
                <div class="toolbar-group">
                    <span class="users-count-label" id="logCountLabel"></span>
                </div>
            </div>

            <!-- Log Table -->
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>When</th>
                                <th>Who</th>
                                <th>Action</th>
                                <th>Type</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                            <tr><td colspan="5"><div class="empty-state"><span class="empty-icon">🗂️</span><p>Loading...</p></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/system-logs.js"></script>
</body>
</html>
